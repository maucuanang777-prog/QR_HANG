<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu sản phẩm</title>
<style>
  body{font-family:Arial,sans-serif;max-width:480px;margin:30px auto;padding:16px;text-align:center;background:#fafafa}
  img{max-width:100%;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  h1{font-size:22px;margin:8px 0}
  .spec{white-space:pre-wrap;text-align:left;background:#fff;padding:14px;border-radius:8px;margin-top:10px;border:1px solid #ddd;font-size:15px;line-height:1.5}
  .muted{color:#888;margin-top:20px;font-size:13px}
</style>
</head>
<body>
<div id="content">Đang tải...</div>
<script>
const GITHUB_USER = "maucuanang777-prog";
const GITHUB_REPO = "QR_HANG";
const BRANCH = "main";

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

// Doc truc tiep qua GitHub API de tranh bi cache boi GitHub Pages CDN (du lieu moi nhat ngay lap tuc)
const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/products.json?ref=${BRANCH}&_=${Date.now()}`;

fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.raw' } })
  .then(r => {
    if (!r.ok) throw new Error('API loi: ' + r.status);
    return r.json();
  })
  .then(data => {
    const p = data.find(x => x.id === id);
    const el = document.getElementById('content');
    if (!p) { el.innerHTML = '<p>Không tìm thấy sản phẩm (mã: ' + (id || 'trống') + ')</p>'; return; }
    el.innerHTML =
      '<img src="' + p.image + '" alt="' + p.name + '">' +
      '<h1>' + p.name + '</h1>' +
      '<div class="spec">' + p.spec + '</div>' +
      '<div class="muted">Mã: ' + p.id + '</div>';
  })
  .catch(err => {
    document.getElementById('content').innerHTML = '<p>Lỗi tải dữ liệu, thử lại sau. (' + err.message + ')</p>';
  });
</script>
</body>
</html>
